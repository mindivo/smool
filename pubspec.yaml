name: smool
description: "Geofence-based auto-mute. Pin places of stillness; the world quiets when you arrive."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^0.9.2
  geolocator: ^13.0.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
